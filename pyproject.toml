[project]
name = "nautilus-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp",
    "dspy",
    "python-dotenv",
    "python-lsp-server",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["index", "mcp_server"]
packages = ["rags"]
